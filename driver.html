<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>واجهة السائق - تكسي اوبر جيلوكا</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />
    <style>
        html, body, #map { height: 100%; width: 100%; margin: 0; padding: 0; font-family: Tahoma, sans-serif; }
        .info-panel {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: white; padding: 15px 20px; border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2); z-index: 1000; text-align: center; width: 85%; max-width: 350px;
        }
        .info-panel h4 { margin: 0 0 8px 0; color: #333; }
        .info-panel p { margin: 5px 0; font-weight: bold; color: #007bff; font-size: 14px; }
    </style>
</head>
<body>
    <div id="map"></div>
    
    <div class="info-panel" id="infoPanel">
        <h4>🚖 لوحة السائق</h4>
        <p id="statusText">بانتظار استقبال طلب جديد...</p>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.min.js"></script>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const driverId = urlParams.get('id');

        const map = L.map('map').setView([35.7437, 43.2758], 13);
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

        let driverLat = null, driverLng = null;
        let routingControl = null;

        if (navigator.geolocation) {
            navigator.geolocation.watchPosition((pos) => {
                driverLat = pos.coords.latitude;
                driverLng = pos.coords.longitude;
                checkNewOrders();
            }, (err) => console.log(err), { enableHighAccuracy: true });
        }

        async function checkNewOrders() {
            if (!driverId || !driverLat || !driverLng) return;

            try {
                const response = await fetch(`https://Jalal1.pythonanywhere.com/get_latest_order?driver_id=${driverId}&t=` + new Date().getTime());
                if (!response.ok) return;
                const data = await response.json();

                if (data.has_order) {
                    const customerLat = parseFloat(data.customer_lat);
                    const customerLng = parseFloat(data.customer_lng);

                    if (routingControl) map.removeControl(routingControl);

                    routingControl = L.Routing.control({
                        waypoints: [
                            L.latLng(driverLat, driverLng),
                            L.latLng(customerLat, customerLng)
                        ],
                        lineOptions: { styles: [{ color: '#007bff', weight: 6 }] },
                        createMarker: function() { return null; },
                        addWaypoints: false,
                        show: false
                    }).addTo(map);

                    routingControl.on('routesfound', function(e) {
                        const routes = e.routes;
                        const summary = routes[0].summary;
                        const distanceKm = (summary.totalDistance / 1000).toFixed(1);
                        const timeMin = Math.round(summary.totalTime / 60);

                        document.getElementById('statusText').innerHTML = `
                            📍 <b>تم استلام الطلب!</b><br>
                            📏 المسافة: <span style="color: #d9534f;">${distanceKm} كم</span> | ⏱️ الوقت: ${timeMin} دقيقة
                        `;
                    });

                    L.marker([customerLat, customerLng]).addTo(map).bindPopup("<b>موقع الزبون الحالي</b>").openPopup();
                }
            } catch (e) {
                console.error(e);
            }
        }

        setInterval(checkNewOrders, 15000);
    </script>
</body>
</html>
