<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خريطة التكاسي المباشرة - تكسي أوبر جيلوكا</title>
    
    <!-- مكتبة الخرائط Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body, #map {
            width: 100%;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .leaflet-popup-content {
            font-size: 14px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <!-- مكتبة الخرائط Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // إعداد الخريطة الافتراضية على مدينة الموصل
        const map = L.map('map').setView([36.34, 43.13], 13);

        // إضافة طبقة الخريطة (OpenStreetMap)
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        // مجموعة الدبابيس لسهولة مسحها وتحديثها
        const markersGroup = L.layerGroup().addTo(map);

        // أيقونة التاكسي
        const taxiIcon = L.icon({
            iconUrl: 'https://cdn-icons-png.flaticon.com/512/3448/3448339.png',
            iconSize: [38, 38],
            iconAnchor: [19, 19],
            popupAnchor: [0, -19]
        });

        // دالة جلب مواقع التكاسي وتحديث الخريطة
        async function updateTaxis() {
            try {
                const response = await fetch('https://Jalal1.pythonanywhere.com/get_drivers');
                const data = await response.json();

                // مسح الدبابيس القديمة
                markersGroup.clearLayers();

                if (Array.isArray(data) && data.length > 0) {
                    data.forEach(pos => {
                        if (pos.latitude && pos.longitude) {
                            const lat = pos.latitude;
                            const lng = pos.longitude;
                            const name = pos.driver_name || "تكسي 1";

                            // إضافة دبوس التاكسي
                            L.marker([lat, lng], { icon: taxiIcon })
                             .addTo(markersGroup)
                             .bindPopup(`<b>🚕 ${name}</b><br>متصل ومتاح الآن`);
                        }
                    });
                }
            } catch (err) {
                console.error("خطأ أثناء جلب بيانات التكاسي:", err);
            }
        }

        // تحديث تلقائي كل 3 ثوانٍ
        setInterval(updateTaxis, 3000);
        
        // تشغيل التحديث فور فتح الصفحة
        updateTaxis();
    </script>
</body>
</html>
