<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تكسي اوبر جيلوكا</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#8ced99">
    <link rel="apple-touch-icon" href="launchericon-192x192.png">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        html, body, #map { height: 100%; width: 100%; margin: 0; padding: 0; }
        .whatsapp-btn { 
            background-color: #25d366; 
            color: white; 
            border: none; 
            padding: 6px 14px; 
            border-radius: 20px; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 14px; 
            margin-top: 8px; 
            text-decoration: none; 
            display: inline-block; 
            text-align: center; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .popup-content { text-align: center; font-family: Tahoma, sans-serif; }
    </style>
</head>
<body>
    <div id="map"></div>

    <script>
        const tg = window.Telegram ? window.Telegram.WebApp : null;
        if (tg) { 
            tg.ready(); 
            tg.expand();
        }

        const map = L.map('map').setView([35.7437, 43.2758], 13);
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(map);

        const userIcon = L.divIcon({
            className: 'user-marker',
            html: '<div style="background-color: #007bff; width: 18px; height: 18px; border-radius: 50%; border: 3px solid white; box-shadow: 0 0 10px rgba(0,123,255,0.8);"></div>',
            iconSize: [22, 22], iconAnchor: [11, 11]
        });

        let userLat = null; 
        let userLng = null;
        let userMarker = null;

        if (navigator.geolocation) {
            navigator.geolocation.watchPosition(
                (pos) => {
                    userLat = pos.coords.latitude;
                    userLng = pos.coords.longitude;
                    const latlng = [userLat, userLng];

                    if (userMarker) {
                        userMarker.setLatLng(latlng);
                    } else {
                        userMarker = L.marker(latlng, { icon: userIcon }).addTo(map).bindPopup("موقعك الحالي");
                        map.setView(latlng, 15);
                    }
                },
                (err) => { console.log("خطأ في تحديد الموقع:", err); },
                { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
            );
        }

        function sendOrderToServer(trackerId, lat, lng) {
            const data = {
                tracker_id: String(trackerId).trim(),
                lat: lat,
                lng: lng,
                name: (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) ? tg.initDataUnsafe.user.first_name : "زبون"
            };
            fetch('https://Jalal1.pythonanywhere.com/send_order', {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
                body: JSON.stringify(data),
                keepalive: true
            }).catch(err => console.error(err));
        }

        let driverMarkers = {};

        async function fetchDrivers() {
            try {
                const response = await fetch('https://Jalal1.pythonanywhere.com/get_drivers?t=' + new Date().getTime());
                if (!response.ok) return;
                const drivers = await response.json();

                drivers.forEach(driver => {
                    const driverId = driver.id;
                    const name = driver.name || 'تاكسي';
                    const phone = driver.phone || '9647703568918'; 
                    const lat = parseFloat(driver.lat);
                    const lng = parseFloat(driver.lng);

                    if (lat && lng) {
                        let latToSend = userLat !== null ? userLat : map.getCenter().lat;
                        let lngToSend = userLng !== null ? userLng : map.getCenter().lng;
                        const mapLink = `https://www.google.com/maps?q=${latToSend},${lngToSend}`;
                        
                        const waMessage = encodeURIComponent(`🚖 مرحباً بك الكابتن (${name})،\nأود طلب تكسي إلى موقعي الحالي:\n${mapLink}`);
                        const waUrl = `https://wa.me/${phone}?text=${waMessage}`;

                        const popupContent = `
                            <div class="popup-content">
                                <b>${name}</b><br>
                                <a href="${waUrl}" target="_blank" onclick="sendOrderToServer('${driverId}', ${latToSend}, ${lngToSend})" class="whatsapp-btn">💬 طلب عبر الواتساب</a>
                            </div>
                        `;

                        if (driverMarkers[driverId]) {
                            driverMarkers[driverId].setLatLng([lat, lng]);
                            driverMarkers[driverId].getPopup().setContent(popupContent);
                        } else {
                            driverMarkers[driverId] = L.marker([lat, lng]).addTo(map).bindPopup(popupContent);
                        }
                    }
                });
            } catch (err) {
                console.error("خطأ في جلب البيانات:", err);
            }
        }

        fetchDrivers();
        setInterval(fetchDrivers, 60000);
    </script>
</body>
</html>
