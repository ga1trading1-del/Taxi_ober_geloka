<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خارطة تحديد موقع الزبون</title>
    
    <!-- مكتبة Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            font-family: Arial, sans-serif;
        }
        /* حاوية الخارطة على كامل الشاشة */
        #map {
            width: 100%;
            height: 100vh;
        }
    </style>
</head>
<body>

    <!-- عنصر الخارطة -->
    <div id="map"></div>

    <!-- مكتبة Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // 1. إعداد الخارطة وتحديد مركز افتراضي (مثلاً بغداد) مع التكبير
        var map = L.map('map').setView([33.3152, 44.3661], 13);

        // 2. تحميل بلاطات الخارطة من OpenStreetMap
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        // متغيرات لحفظ أشكال الدائرة ودائرة الدقة
        var userCircle = null;
        var accuracyCircle = null;

        // 3. التتبع المباشر الحي لموقع الزبون (GPS)
        if (navigator.geolocation) {
            navigator.geolocation.watchPosition(
                function(position) {
                    var lat = position.coords.latitude;
                    var lng = position.coords.longitude;
                    var accuracy = position.coords.accuracy; // مدى الدقة بالمتر

                    // إذا كانت الدائرة موجودة مسبقاً، نكتفي بتحديث موقعها مع تحرك الزبون
                    if (userCircle) {
                        userCircle.setLatLng([lat, lng]);
                        accuracyCircle.setLatLng([lat, lng]).setRadius(accuracy);
                    } else {
                        // إنشاء دائرة مدى الدقة الشفافة خلف النقطة
                        accuracyCircle = L.circle([lat, lng], {
                            radius: accuracy,
                            color: '#1a73e8',
                            fillColor: '#1a73e8',
                            fillOpacity: 0.15,
                            stroke: false
                        }).addTo(map);

                        // إنشاء الدائرة الزرقاء (موقع الزبون الحالي)
                        userCircle = L.circleMarker([lat, lng], {
                            radius: 8,           // حجم النقطة
                            color: '#ffffff',    // إطار أبيض
                            weight: 2,           // سمك الإطار
                            fillColor: '#1a73e8', // الأزرق الشهير
                            fillOpacity: 1
                        }).addTo(map);

                        // تمركز الخارطة عند الزبون لأول مرة
                        map.setView([lat, lng], 16);
                    }
                },
                function(error) {
                    console.error("خطأ في تحديد الموقع: ", error);
                },
                {
                    enableHighAccuracy: true, // تفعيل أعلى دقة GPS
                    maximumAge: 1000,         // عدم استخدام موقع قديم
                    timeout: 7000
                }
            );
        } else {
            alert("متصفحك لا يدعم خدمة تحديد الموقع.");
        }
    </script>
</body>
</html>
