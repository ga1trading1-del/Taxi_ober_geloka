<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تكسي اوبر جيلوكا</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; font-family: Arial, sans-serif; }
        #map { width: 100%; height: 100vh; }
    </style>
</head>
<body>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // 1. إنشاء الخريطة والتركيز الافتراضي على بغداد
        var map = L.map('map').setView([33.3152, 44.3661], 13);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        var userCircle = null;
        var accuracyCircle = null;
        var driversMarkers = {};

        // 2. تتبع موقع الزبون اللحظي (الدائرة الزرقاء)
        if (navigator.geolocation) {
            navigator.geolocation.watchPosition(
                function(position) {
                    var lat = position.coords.latitude;
                    var lng = position.coords.longitude;
                    var accuracy = position.coords.accuracy;

                    if (userCircle) {
                        userCircle.setLatLng([lat, lng]);
                        accuracyCircle.setLatLng([lat, lng]).setRadius(accuracy);
                    } else {
                        accuracyCircle = L.circle([lat, lng], {
                            radius: accuracy,
                            color: '#1a73e8',
                            fillColor: '#1a73e8',
                            fillOpacity: 0.15,
                            stroke: false
                        }).addTo(map);

                        userCircle = L.circleMarker([lat, lng], {
                            radius: 8,
                            color: '#ffffff',
                            weight: 2,
                            fillColor: '#1a73e8',
                            fillOpacity: 1
                        }).addTo(map);

                        map.setView([lat, lng], 15);
                    }
                },
                function(error) { console.error("GPS Error:", error); },
                { enableHighAccuracy: true, maximumAge: 1000, timeout: 7000 }
            );
        }

        // 3. أيقونة التاكسي
        var taxiIcon = L.icon({
            iconUrl: 'https://cdn-icons-png.flaticon.com/512/3202/3202052.png',
            iconSize: [35, 35],
            iconAnchor: [17, 17],
            popupAnchor: [0, -15]
        });

        // 4. جلب إحداثيات السائقين من سيرفر Traccar باستخدام بيانات حسابك
        var traccarUrl = 'https://traccar-production-822f.up.railway.app/api/positions';
        var email = 'ga1trading1@gmail.com';
        var password = '1GALAL1galal';

        function loadTraccarPositions() {
            fetch(traccarUrl, {
                headers: {
                    'Authorization': 'Basic ' + btoa(email + ':' + password),
                    'Accept': 'application/json'
                }
            })
            .then(response => {
                if (!response.ok) throw new Error("HTTP error " + response.status);
                return response.json();
            })
            .then(positions => {
                positions.forEach(pos => {
                    var deviceId = pos.deviceId;
                    var lat = pos.latitude;
                    var lng = pos.longitude;

                    if (lat && lng) {
                        if (driversMarkers[deviceId]) {
                            // تحديث موقع التاكسي
                            driversMarkers[deviceId].setLatLng([lat, lng]);
                        } else {
                            // إضافة التاكسي على الخريطة
                            var marker = L.marker([lat, lng], { icon: taxiIcon })
                                .bindPopup(`<b>سائق تاكسي متوفر</b><br>رقم الجهاز: ${deviceId}`)
                                .addTo(map);
                            driversMarkers[deviceId] = marker;
                        }
                    }
                });
            })
            .catch(err => console.log("بانتظار تحديث مواقع السائقين...", err));
        }

        // تشغيل الجلب والتحديث كل 3 ثوانٍ
        loadTraccarPositions();
        setInterval(loadTraccarPositions, 3000);
    </script>
</body>
</html>
