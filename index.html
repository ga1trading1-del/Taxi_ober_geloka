<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تتبع التاكسي - تكسي اوبر جيلوكا</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        html, body, #map { height: 100%; width: 100%; margin: 0; padding: 0; font-family: Tahoma, sans-serif; }
        .request-btn { background-color: #25d366; color: white; border: none; padding: 10px 14px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 8px; width: 100%; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .request-btn:hover { background-color: #1ebe5d; }
    </style>
</head>
<body>
    <div id="map"></div>

    <script>
        const tg = window.Telegram ? window.Telegram.WebApp : null;
        if (tg) { 
            tg.ready(); 
            tg.expand();
        }

        // مركز افتراضي مؤقت
        const map = L.map('map').setView([36.34, 43.13], 13);
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(map);

        // تخصيص الدائرة الزرقاء لموقعك الحالي
        const userCircleStyle = { radius: 10, fillColor: "#007bff", color: "#ffffff", weight: 3, opacity: 1, fillOpacity: 1 };
        let userLat = null; 
        let userLng = null;
        let userMarker = null;
        let centered = false;

        if (navigator.geolocation) {
            navigator.geolocation.watchPosition(
                (pos) => {
                    userLat = pos.coords.latitude;
                    userLng = pos.coords.longitude;
                    const latlng = [userLat, userLng];

                    if (userMarker) {
                        userMarker.setLatLng(latlng);
                    } else {
                        userMarker = L.circleMarker(latlng, userCircleStyle).addTo(map).bindPopup("موقعك الحالي");
                    }

                    // تركز الخريطة على موقعك الحقيقي أول ما يفتح التطبيق
                    if (!centered) {
                        map.setView(latlng, 16);
                        centered = true;
                    }
                },
                (err) => { console.log("خطأ في تحديد الموقع:", err); },
                { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
            );
        }

        let driverMarkers = {};

        async function fetchDrivers() {
            try {
                const response = await fetch('https://Jalal1.pythonanywhere.com/get_drivers?t=' + new Date().getTime());
                if (!response.ok) return;
                const drivers = await response.json();

                drivers.forEach(driver => {
                    const driverId = driver.id;
                    const name = driver.name || 'تاكسي';
                    const phone = driver.phone || '9647703568918'; 
                    const lat = parseFloat(driver.lat);
                    const lng = parseFloat(driver.lng);

                    if (!isNaN(lat) && !isNaN(lng)) {
                        const popupContent = `
                            <div style="text-align: right; font-family: Tahoma; min-width: 150px;">
                                <b style="font-size: 16px; color: #333;">🚖 ${name}</b><br>
                                <button class="request-btn" onclick="orderViaWhatsApp('${phone}', '${name}')">
                                    💬 طلب عبر الواتساب
                                </button>
                            </div>
                        `;

                        if (driverMarkers[driverId]) {
                            driverMarkers[driverId].setLatLng([lat, lng]);
                            driverMarkers[driverId].getPopup().setContent(popupContent);
                        } else {
                            driverMarkers[driverId] = L.marker([lat, lng]).addTo(map).bindPopup(popupContent);
                        }
                    }
                });
            } catch (err) {
                console.error("خطأ في جلب البيانات:", err);
            }
        }

        function orderViaWhatsApp(phone, driverName) {
            if (!userLat || !userLng) {
                alert("جاري تحديد موقعك على الخريطة، يرجى الانتظار ثانية ثم المحاولة.");
                return;
            }

            const mapLink = `https://www.google.com/maps?q=${userLat},${userLng}`;
            const message = `🚖 أهلاً بك، أود طلب التاكسي (${driverName}). موقعي الحالي على الخريطة:\n${mapLink}`;
            const whatsappUrl = `https://wa.me/${phone}?text=${encodeURIComponent(message)}`;
            window.open(whatsappUrl, '_blank');
        }

        fetchDrivers();
        setInterval(fetchDrivers, 5000);
    </script>
</body>
</html>
