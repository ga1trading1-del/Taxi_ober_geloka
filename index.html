<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تتبع التاكسي</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        html, body, #map {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
        }
    </style>
</head>
<body>
    <div id="map"></div>

    <script>
        // تهيئة التليجرام WebApp
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }

        // إنشاء الخريطة وتحديد المركز الافتراضي (الموصل)
        const map = L.map('map').setView([36.34, 43.13], 13);

        // تحميل بلاط OpenStreetMap الموثوق عبر HTTPS
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        // تحديد موقع المستخدم عند الفتح
        map.locate({setView: true, maxZoom: 15});

        function onLocationFound(e) {
            L.marker(e.latlng).addTo(map)
                .bindPopup("موقعك الحالي").openPopup();
        }
        map.on('locationfound', onLocationFound);

        function onLocationError(e) {
            console.log("لم يتم تحديد الموقع: " + e.message);
        }
        map.on('locationerror', onLocationError);

        // جلب مواقع السائقين مباشرة من سيرفر PythonAnywhere
        async function fetchDrivers() {
            try {
                const response = await fetch('https://ga1trading1-del.pythonanywhere.com/api/drivers');
                const drivers = await response.json();
                drivers.forEach(driver => {
                    if (driver.lat && driver.lng) {
                        L.marker([driver.lat, driver.lng])
                            .addTo(map)
                            .bindPopup(`السائق: ${driver.name || 'تاكسي'}`);
                    }
                });
            } catch (err) {
                console.error("خطأ في جلب السائقين:", err);
            }
        }

        fetchDrivers();
        setInterval(fetchDrivers, 10000);
    </script>
</body>
</html>
