<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تتبع التاكسي - تكسي اوبر جيلوكا</title>
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#4ef292">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        html, body, #map { height: 100%; width: 100%; margin: 0; padding: 0; font-family: Tahoma, sans-serif; }
        .request-btn { background-color: #28a745; color: white; border: none; padding: 8px 12px; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 5px; width: 100%; }
    </style>
</head>
<body>
    <div id="map"></div>

    <!-- نافذة المحادثة الداخلية للزبون -->
    <div id="chat-box" style="display:none; position:fixed; bottom:0; left:0; width:100%; height:260px; background:white; z-index:99999; border-top:3px solid #28a745; box-shadow: 0 -4px 15px rgba(0,0,0,0.2);">
        <div style="background:#28a745; color:white; padding:10px; display:flex; justify-content:space-between; align-items:center;">
            <span id="chat-title" style="font-weight:bold;">المحادثة مع السائق</span>
            <button onclick="endTrip()" style="background:#dc3545; color:white; border:none; padding:5px 10px; border-radius:4px; cursor:pointer;">إنهاء الرحلة</button>
        </div>
        <div id="messages" style="height:150px; overflow-y:auto; padding:10px; font-size:14px; background:#f8f9fa;"></div>
        <div style="display:flex; padding:8px; background:#fff; border-top:1px solid #ddd;">
            <input type="text" id="chat-input" placeholder="اكتب رسالتك للسائق هنا..." style="flex:1; padding:8px; border:1px solid #ccc; border-radius:4px; outline:none;">
            <button onclick="sendMessage()" style="background:#28a745; color:white; border:none; padding:8px 15px; margin-right:5px; border-radius:4px; cursor:pointer;">إرسال</button>
        </div>
    </div>

    <script>
        const map = L.map('map').setView([36.34, 43.13], 13);
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

        let userLat = null, userLng = null, userMarker = null, selectedDriverId = null;
        let customerName = "زبون التطبيق (" + Math.floor(Math.random() * 1000) + ")";

        // خصائص الدائرة الزرقاء لموقعك الحالي (شكل دائري نقي بدون دبابيس)
        const userCircleStyle = {
            radius: 9,
            fillColor: "#007bff",
            color: "#ffffff",
            weight: 3,
            opacity: 1,
            fillOpacity: 1
        };

        // تتبع الموقع وتحديث الدائرة الزرقاء بسلاسة تامة
        if (navigator.geolocation) {
            navigator.geolocation.watchPosition(
                (pos) => {
                    userLat = pos.coords.latitude;
                    userLng = pos.coords.longitude;
                    const latlng = [userLat, userLng];
                    
                    if (userMarker) {
                        userMarker.setLatLng(latlng);
                    } else {
                        userMarker = L.circleMarker(latlng, userCircleStyle).addTo(map).bindPopup("موقعك الحالي");
                        map.setView(latlng, 15);
                    }
                },
                (err) => { console.log("خطأ في تحديد الموقع:", err); },
                { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
            );
        }

        let driverMarkers = {};
        async function fetchDrivers() {
            try {
                const response = await fetch('https://Jalal1.pythonanywhere.com/get_drivers?t=' + new Date().getTime());
                const drivers = await response.json();
                drivers.forEach(driver => {
                    const driverId = driver.id;
                    const name = driver.name || 'تاكسي';
                    const popupContent = `<div><b>السائق: ${name}</b><br><button class="request-btn" onclick="requestTaxi('${driverId}', '${name}', this)">طلب التاكسي</button></div>`;
                    if (driverMarkers[driverId]) {
                        driverMarkers[driverId].setLatLng([driver.lat, driver.lng]);
                    } else {
                        driverMarkers[driverId] = L.marker([driver.lat, driver.lng]).addTo(map).bindPopup(popupContent);
                    }
                });
            } catch (err) { console.error(err); }
        }

        async function requestTaxi(driverId, driverName, btn) {
            if (btn) { btn.disabled = true; btn.innerText = "جاري الاتصال..."; }
            selectedDriverId = driverId;
            document.getElementById('chat-title').innerText = "المحادثة مع: " + driverName;
            document.getElementById('chat-box').style.display = 'block';
            
            const msgContainer = document.getElementById('messages');
            msgContainer.innerHTML += `<div style="margin:5px 0; color:#007bff;"><b>النظام:</b> تم إرسال طلبك وموقعك للسائق بنجاح.</div>`;

            try {
                await fetch('https://Jalal1.pythonanywhere.com/request-taxi', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ driver_id: driverId, driver_name: driverName, lat: userLat, lng: userLng, customer_name: customerName })
                });
            } catch (e) { console.error(e); }
        }

        async function sendMessage() {
            const input = document.getElementById('chat-input');
            let text = input.value.trim();
            if (!text || !selectedDriverId) return;

            const msgContainer = document.getElementById('messages');
            msgContainer.innerHTML += `<div style="margin:5px 0; text-align:left;"><b>أنت:</b> ${text}</div>`;
            input.value = '';
            msgContainer.scrollTop = msgContainer.scrollHeight;

            try {
                await fetch('https://Jalal1.pythonanywhere.com/send-from-app', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ driver_id: selectedDriverId, message: text, customer_name: customerName })
                });
            } catch (e) { console.error(e); }
        }

        async function checkDriverReplies() {
            if (!selectedDriverId) return;
            try {
                const res = await fetch(`https://Jalal1.pythonanywhere.com/get-app-messages?driver_id=${selectedDriverId}`);
                const data = await res.json();
                if (data.messages && data.messages.length > 0) {
                    const msgContainer = document.getElementById('messages');
                    data.messages.forEach(msg => {
                        msgContainer.innerHTML += `<div style="margin:5px 0; text-align:right; color:#28a745;"><b>السائق:</b> ${msg}</div>`;
                    });
                    msgContainer.scrollTop = msgContainer.scrollHeight;
                }
            } catch (e) {}
        }
        setInterval(checkDriverReplies, 2000);

        function endTrip() {
            if (confirm("هل تريد إنهاء الرحلة؟")) {
                document.getElementById('messages').innerHTML = '';
                document.getElementById('chat-box').style.display = 'none';
                selectedDriverId = null;
            }
        }

        fetchDrivers();
        setInterval(fetchDrivers, 10000);
    </script>
</body>
</html>
