<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تتبع التاكسي</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        html, body, #map {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
        }
        .request-btn {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 5px;
            width: 100%;
        }
    </style>
</head>
<body>
    <div id="map"></div>

    <script>
        const tg = window.Telegram ? window.Telegram.WebApp : null;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        const map = L.map('map').setView([36.34, 43.13], 13);

        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        map.locate({setView: true, maxZoom: 15});

        map.on('locationfound', (e) => {
            L.marker(e.latlng).addTo(map).bindPopup("موقعك الحالي").openPopup();
        });

        let driverMarkers = {};

        async function fetchDrivers() {
            try {
                const response = await fetch('https://ga1trading1-del.pythonanywhere.com/api/drivers');
                const drivers = await response.json();
                
                drivers.forEach(driver => {
                    const driverId = driver.id || driver.traccar_id;
                    const lat = driver.lat;
                    const lng = driver.lng;
                    const name = driver.name || 'تاكسي';

                    if (lat && lng) {
                        const popupContent = `
                            <div>
                                <b>السائق: ${name}</b><br>
                                <button class="request-btn" onclick="requestTaxi('${driverId}', '${name}')">طلب التاكسي</button>
                            </div>
                        `;

                        if (driverMarkers[driverId]) {
                            driverMarkers[driverId].setLatLng([lat, lng]);
                        } else {
                            driverMarkers[driverId] = L.marker([lat, lng]).addTo(map).bindPopup(popupContent);
                        }
                    }
                });
            } catch (err) {
                console.error("خطأ في جلب بيانات السائقين:", err);
            }
        }

        function requestTaxi(driverId, driverName) {
            if (tg) {
                tg.sendData(JSON.stringify({
                    action: 'request_taxi',
                    driver_id: driverId,
                    driver_name: driverName
                }));
                tg.close();
            } else {
                alert(`تم إرسال طلب للتاكسي: ${driverName}`);
            }
        }

        fetchDrivers();
        setInterval(fetchDrivers, 5000);
    </script>
</body>
</html>
