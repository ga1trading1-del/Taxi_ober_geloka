<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تكسي اوبر جيلوكا</title>
    
    <!-- مكتبة Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            font-family: Arial, sans-serif;
        }
        #map {
            width: 100%;
            height: 100vh;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <!-- مكتبة Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // 1. إنشاء الخريطة وتحديد المركز الافتراضي
        var map = L.map('map').setView([33.3152, 44.3661], 13);

        // 2. تحميل طبقة OpenStreetMap
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        // متغيرات موقع الزبون
        var userCircle = null;
        var accuracyCircle = null;

        // 3. تحديد وتتبع موقع الزبون اللحظي (الدائرة الزرقاء)
        if (navigator.geolocation) {
            navigator.geolocation.watchPosition(
                function(position) {
                    var lat = position.coords.latitude;
                    var lng = position.coords.longitude;
                    var accuracy = position.coords.accuracy;

                    if (userCircle) {
                        userCircle.setLatLng([lat, lng]);
                        accuracyCircle.setLatLng([lat, lng]).setRadius(accuracy);
                    } else {
                        // دائرة مدى الدقة
                        accuracyCircle = L.circle([lat, lng], {
                            radius: accuracy,
                            color: '#1a73e8',
                            fillColor: '#1a73e8',
                            fillOpacity: 0.15,
                            stroke: false
                        }).addTo(map);

                        // الدائرة الزرقاء لموقع الزبون
                        userCircle = L.circleMarker([lat, lng], {
                            radius: 8,
                            color: '#ffffff',
                            weight: 2,
                            fillColor: '#1a73e8',
                            fillOpacity: 1
                        }).addTo(map);

                        map.setView([lat, lng], 15);
                    }
                },
                function(error) {
                    console.error("خطأ في تحديد موقع الزبون: ", error);
                },
                {
                    enableHighAccuracy: true,
                    maximumAge: 1000,
                    timeout: 7000
                }
            );
        }
    </script>
</body>
</html>
