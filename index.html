<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تكسي اوبر جيلوكا - حجز التاكسي</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        html, body, #map { height: 100%; width: 100%; margin: 0; padding: 0; font-family: Tahoma, sans-serif; }
        .drivers-panel {
            position: absolute; top: 15px; right: 15px; background: white; 
            padding: 12px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); 
            z-index: 1000; width: 280px; max-height: 70vh; overflow-y: auto;
        }
        .driver-card {
            background: #f8f9fa; padding: 10px; margin-bottom: 8px; border-radius: 8px;
            border: 1px solid #ddd; text-align: center;
        }
        .driver-card h4 { margin: 0 0 5px 0; color: #333; font-size: 16px; }
        .whatsapp-btn {
            background: #25d366; color: white; border: none; padding: 6px 12px;
            border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 5px;
        }
        .whatsapp-btn:hover { background: #1ebe5d; }
    </style>
</head>
<body>
    <div id="map"></div>

    <div class="drivers-panel">
        <h3 style="margin-top:0; text-align:center; font-size:15px; color:#007bff;">🚖 السائقون المتاحون</h3>
        <div id="driversList">جاري تحميل السائقين...</div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map').setView([36.34, 43.13], 13);
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

        let userLat = null, userLng = null, userMarker = null;

        // تحديد موقع الزبون الحالي على الخريطة
        if (navigator.geolocation) {
            navigator.geolocation.watchPosition((pos) => {
                userLat = pos.coords.latitude;
                userLng = pos.coords.longitude;

                if (!userMarker) {
                    userMarker = L.marker([userLat, userLng]).addTo(map).bindPopup("📍 موقعك الحالي").openPopup();
                    map.setView([userLat, userLng], 15);
                } else {
                    userMarker.setLatLng([userLat, userLng]);
                }
            }, (err) => console.log(err), { enableHighAccuracy: true });
        }

        // جلب قائمة السائقين النشطين من السيرفر
        async function fetchDrivers() {
            try {
                const response = await fetch('https://Jalal1.pythonanywhere.com/get_drivers');
                const drivers = await response.json();
                const listDiv = document.getElementById('driversList');
                listDiv.innerHTML = '';

                if (drivers.length === 0) {
                    listDiv.innerHTML = '<p style="text-align:center; color:#777;">لا يوجد سائقون متصلون حالياً.</p>';
                    return;
                }

                drivers.forEach(driver => {
                    // إضافة ماركر لكل سائق على الخريطة
                    L.marker([driver.lat, driver.lng]).addTo(map).bindPopup(`<b>${driver.name}</b>`);

                    // إضافة بطاقة السائق في القائمة الجانبية
                    const card = document.createElement('div');
                    card.className = 'driver-card';
                    card.innerHTML = `
                        <h4>${driver.name}</h4>
                        <button class="whatsapp-btn" onclick="orderViaWhatsApp('${driver.phone}', '${driver.id}', '${driver.name}')">
                            طلب عبر الواتساب 💬
                        </button>
                    `;
                    listDiv.appendChild(card);
                });
            } catch (e) {
                console.error("خطأ في جلب السائقين:", e);
            }
        }

        // دالة طلب التاكسي عبر الواتساب وإرسال الموقع للسائق تلقائياً
        function orderViaWhatsApp(phone, driverId, driverName) {
            if (!userLat || !userLng) {
                alert("جاري تحديد موقعك على الخريطة، يرجى الانتظار ثانية.");
                return;
            }

            // 1. إرسال الإحداثيات لسيرفر البوت لكي تظهر فوراً على شاشة السائق
            fetch('https://Jalal1.pythonanywhere.com/save_order_location', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ driver_id: driverId, lat: userLat, lng: userLng })
            }).catch(err => console.log(err));

            // 2. فتح تطبيق الواتساب برسالة جاهزة للعميل
            const mapLink = `https://www.google.com/maps?q=${userLat},${userLng}`;
            const message = `🚖 أهلاً بك، أود طلب التاكسي (${driverName}). موقعي الحالي على الخريطة:\n${mapLink}`;
            window.open(`https://wa.me/${phone}?text=${encodeURIComponent(message)}`, '_blank');
        }

        // تحديث قائمة السائقين كل 10 ثوانٍ
        fetchDrivers();
        setInterval(fetchDrivers, 10000);
    </script>
</body>
</html>
