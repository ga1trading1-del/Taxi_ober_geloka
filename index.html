<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تكسي اوبر جيلوكا</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.min.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        html, body, #map { height: 100%; width: 100%; margin: 0; padding: 0; font-family: Tahoma, sans-serif; }
        .request-btn { background-color: #25d366; color: white; border: none; padding: 10px 14px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 8px; width: 100%; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .request-btn:hover { background-color: #1ebe5d; }
        
        .info-panel {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: white; padding: 15px 20px; border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2); z-index: 1000; text-align: center; width: 85%; max-width: 350px;
            display: none;
        }
        .info-panel h4 { margin: 0 0 8px 0; color: #333; }
        .info-panel p { margin: 5px 0; font-weight: bold; color: #007bff; font-size: 14px; }
    </style>
</head>
<body>
    <div id="map"></div>

    <div class="info-panel" id="driverInfoPanel">
        <h4>🚖 لوحة الملاحة (سائق)</h4>
        <p id="statusText">بانتظار استقبال طلب جديد...</p>
    </div>

    <script>
        const tg = window.Telegram ? window.Telegram.WebApp : null;
        if (tg) { 
            tg.ready(); 
            tg.expand();
        }

        const map = L.map('map').setView([35.7437, 43.2758], 13);
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(map);

        const urlParams = new URLSearchParams(window.location.search);
        const driverId = urlParams.get('driver_id');
        const isDriver = driverId !== null && driverId !== '';

        const circleStyle = { radius: 9, fillColor: "#007bff", color: "#ffffff", weight: 3, opacity: 1, fillOpacity: 1 };
        let myLat = null, myLng = null;
        let myMarker = null;
        let driverMarkers = {};
        let routingControl = null;

        if (isDriver) {
            document.getElementById('driverInfoPanel').style.display = 'block';

            if (navigator.geolocation) {
                navigator.geolocation.watchPosition((pos) => {
                    myLat = pos.coords.latitude;
                    myLng = pos.coords.longitude;
                    const latlng = [myLat, myLng];

                    if (myMarker) {
                        myMarker.setLatLng(latlng);
                    } else {
                        myMarker = L.circleMarker(latlng, circleStyle).addTo(map).bindPopup("📍 موقعك الحالي (السائق)").openPopup();
                        map.setView(latlng, 15);
                    }
                    checkDriverOrders();
                }, (err) => console.log(err), { enableHighAccuracy: true });
            }

            async function checkDriverOrders() {
                if (!driverId || !myLat || !myLng) return;
                try {
                    const response = await fetch(`https://Jalal1.pythonanywhere.com/get_latest_order?driver_id=${driverId}&t=` + new Date().getTime());
                    if (!response.ok) return;
                    const data = await response.json();

                    if (data.has_order) {
                        const customerLat = parseFloat(data.customer_lat);
                        const customerLng = parseFloat(data.customer_lng);

                        if (routingControl) map.removeControl(routingControl);

                        routingControl = L.Routing.control({
                            waypoints: [
                                L.latLng(myLat, myLng),
                                L.latLng(customerLat, customerLng)
                            ],
                            lineOptions: { styles: [{ color: '#007bff', weight: 6 }] },
                            createMarker: function() { return null; },
                            addWaypoints: false,
                            show: false
                        }).addTo(map);

                        routingControl.on('routesfound', function(e) {
                            const summary = e.routes[0].summary;
                            const distanceKm = (summary.totalDistance / 1000).toFixed(1);
                            const timeMin = Math.round(summary.totalTime / 60);

                            document.getElementById('statusText').innerHTML = `
                                📍 <b>تم استلام الطلب بنجاح!</b><br>
                                📏 المسافة: <span style="color: #d9534f;">${distanceKm} كم</span> | ⏱️ الوقت: ${timeMin} دقيقة
                            `;
                        });

                        L.marker([customerLat, customerLng]).addTo(map).bindPopup("<b>موقع الزبون الحالي</b>").openPopup();
                    }
                } catch (e) {
                    console.error(e);
                }
            }
            setInterval(checkDriverOrders, 10000);

        } else {
            if (navigator.geolocation) {
                navigator.geolocation.watchPosition((pos) => {
                    myLat = pos.coords.latitude;
                    myLng = pos.coords.longitude;
                    const latlng = [myLat, myLng];

                    if (myMarker) {
                        myMarker.setLatLng(latlng);
                    } else {
                        myMarker = L.circleMarker(latlng, circleStyle).addTo(map).bindPopup("موقعك الحالي");
                        map.setView(latlng, 15);
                    }
                }, (err) => console.log(err), { enableHighAccuracy: true });
            }

            async function fetchDrivers() {
                try {
                    const response = await fetch('https://Jalal1.pythonanywhere.com/get_drivers?t=' + new Date().getTime());
                    if (!response.ok) return;
                    const drivers = await response.json();

                    // مسح العلامات القديمة بالكامل لمنع أي تداخل
                    Object.values(driverMarkers).forEach(marker => map.removeLayer(marker));
                    driverMarkers = {};

                    drivers.forEach(driver => {
                        const dId = String(driver.id);
                        const name = String(driver.name || 'تاكسي');
                        const phone = String(driver.phone || '').trim(); // جلب رقم الهاتف الفعلي المرسل من السيرفر حصرياً بدون أي رقم افتراضي
                        const lat = parseFloat(driver.lat || 35.7437);
                        const lng = parseFloat(driver.lng || 43.2758);

                        if (lat && lng) {
                            const popupContent = `
                                <div style="text-align: right; font-family: Tahoma; min-width: 160px;">
                                    <b style="font-size: 16px; color: #333;">🚖 ${name}</b><br>
                                    <span style="font-size: 12px; color: #666;">📞 ${phone}</span><br>
                                    <button class="request-btn" onclick="orderViaWhatsApp('${dId}', '${phone}', '${name}')">
                                        💬 طلب عبر الواتساب
                                    </button>
                                </div>
                            `;

                            const marker = L.marker([lat, lng]).addTo(map).bindPopup(popupContent);
                            driverMarkers[dId] = marker;
                        }
                    });
                } catch (err) {
                    console.error("خطأ في جلب السائقين:", err);
                }
            }

            function orderViaWhatsApp(dId, phone, driverName) {
                if (!myLat || !myLng) {
                    alert("جاري تحديد موقعك على الخريطة، يرجى الانتظار ثانية ثم المحاولة.");
                    return;
                }

                fetch('https://Jalal1.pythonanywhere.com/save_order_location', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ driver_id: dId, lat: myLat, lng: myLng })
                }).catch(err => console.log(err));

                const mapLink = `https://www.google.com/maps?q=${myLat},${myLng}`;
                const message = `🚖 أهلاً بك، أود طلب التاكسي (${driverName}). موقعي الحالي على الخريطة:\n${mapLink}`;
                
                window.open(`https://wa.me/${phone}?text=${encodeURIComponent(message)}`, '_blank');
            }

            fetchDrivers();
            setInterval(fetchDrivers, 60000);
        }
    </script>
</body>
</html>
