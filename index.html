<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تكسي جيلوكا</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#8ced99">
    <link rel="apple-touch-icon" href="launchericon-192x192.png">
    
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="preconnect" href="https://mt1.google.com">
    <link rel="preconnect" href="https://Jalal1.pythonanywhere.com">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
    
    <style>
        html, body, #map { height: 100%; width: 100%; margin: 0; padding: 0; background-color: #f0efe9; }
        .whatsapp-btn { 
            background-color: #25d366; 
            color: white; 
            border: none; 
            padding: 8px 16px; 
            border-radius: 20px; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 14px; 
            margin-top: 8px; 
            text-decoration: none; 
            display: inline-block; 
            text-align: center; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .popup-content { text-align: center; font-family: Tahoma, sans-serif; }
    </style>
</head>
<body>
    <div id="map"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js" async></script>

    <script>
        window.addEventListener('load', () => {
            if (window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.ready();
                window.Telegram.WebApp.expand();
            }
        });

        // إنشاء الخريطة فوراً
        const map = L.map('map', {
            zoomControl: true,
            attributionControl: false
        }).setView([35.7437, 43.2758], 14);

        // خرائط Google Streets السريعة جداً (تعمل مجاناً بدون مفتاح API وتدعم العربية)
        const googleStreets = L.tileLayer('https://mt{s}.google.com/vt/lyrs=m&hl=ar&x={x}&y={y}&z={z}', {
            maxZoom: 20,
            subdomains: ['0', '1', '2', '3']
        }).addTo(map);

        // خريطة احتياطية فورية في حال حدوث أي مشكلة
        googleStreets.on('tileerror', function() {
            if (!map.hasLayer(esriFallback)) {
                esriFallback.addTo(map);
            }
        });

        const esriFallback = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 19
        });

        const userIcon = L.divIcon({
            className: 'user-marker',
            html: '<div style="background-color: #007bff; width: 18px; height: 18px; border-radius: 50%; border: 3px solid white; box-shadow: 0 0 10px rgba(0,123,255,0.8);"></div>',
            iconSize: [22, 22], iconAnchor: [11, 11]
        });

        let userLat = null; 
        let userLng = null;
        let userMarker = null;

        if (navigator.geolocation) {
            navigator.geolocation.watchPosition(
                (pos) => {
                    userLat = pos.coords.latitude;
                    userLng = pos.coords.longitude;
                    const latlng = [userLat, userLng];

                    if (userMarker) {
                        userMarker.setLatLng(latlng);
                    } else {
                        userMarker = L.marker(latlng, { icon: userIcon }).addTo(map).bindPopup("موقعك الحالي");
                        map.setView(latlng, 15);
                    }
                },
                (err) => { console.log("خطأ GPS:", err); },
                { enableHighAccuracy: false, timeout: 6000, maximumAge: 15000 }
            );
        }

        function sendOrderToServer(trackerId, lat, lng) {
            const tg = window.Telegram ? window.Telegram.WebApp : null;
            const data = {
                tracker_id: String(trackerId).trim(),
                lat: lat,
                lng: lng,
                name: (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) ? tg.initDataUnsafe.user.first_name : "زبون"
            };
            fetch('https://Jalal1.pythonanywhere.com/send_order', {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
                body: JSON.stringify(data),
                keepalive: true
            }).catch(err => console.error(err));
        }

        let driverMarkers = {};

        async function fetchDrivers() {
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 6000);
                
                const response = await fetch('https://Jalal1.pythonanywhere.com/get_drivers?t=' + Date.now(), {
                    signal: controller.signal
                });
                clearTimeout(timeoutId);
                
                if (!response.ok) return;
                const drivers = await response.json();

                drivers.forEach(driver => {
                    const driverId = driver.id;
                    const name = driver.name || 'تاكسي';
                    const phone = driver.phone || '9647703568918'; 
                    const lat = parseFloat(driver.lat);
                    const lng = parseFloat(driver.lng);

                    if (lat && lng) {
                        let latToSend = userLat !== null ? userLat : map.getCenter().lat;
                        let lngToSend = userLng !== null ? userLng : map.getCenter().lng;
                        const mapLink = `https://www.google.com/maps?q=${latToSend},${lngToSend}`;
                        
                        const waMessage = encodeURIComponent(`🚖 مرحباً بك الكابتن (${name})،\nأود طلب تكسي إلى موقعي الحالي:\n${mapLink}`);
                        const waUrl = `https://wa.me/${phone}?text=${waMessage}`;

                        const popupContent = `
                            <div class="popup-content">
                                <b>${name}</b><br>
                                <a href="${waUrl}" target="_blank" onclick="sendOrderToServer('${driverId}', ${latToSend}, ${lngToSend})" class="whatsapp-btn">💬 طلب عبر الواتساب</a>
                            </div>
                        `;

                        if (driverMarkers[driverId]) {
                            driverMarkers[driverId].setLatLng([lat, lng]);
                            driverMarkers[driverId].getPopup().setContent(popupContent);
                        } else {
                            driverMarkers[driverId] = L.marker([lat, lng]).addTo(map).bindPopup(popupContent);
                        }
                    }
                });
            } catch (err) {
                console.error("تأخر السيرفر:", err);
            }
        }

        fetchDrivers();
        setInterval(fetchDrivers, 60000);
    </script>
</body>
</html>
