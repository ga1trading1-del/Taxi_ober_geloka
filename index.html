<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خريطة التكاسي المباشرة</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body, #map { width: 100%; height: 100%; }
    </style>
</head>
<body>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // إنشاء الخريطة
        const map = L.map('map').setView([36.34, 43.13], 13);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        const markersGroup = L.layerGroup().addTo(map);

        // أيقونة التاكسي
        const taxiIcon = L.icon({
            iconUrl: 'https://cdn-icons-png.flaticon.com/512/3448/3448339.png',
            iconSize: [38, 38],
            iconAnchor: [19, 19],
            popupAnchor: [0, -19]
        });

        let userLat = null;
        let userLng = null;

        // 1️⃣ تحديد موقع المستخدم الحالي (الدائرة الزرقاء)
        if (navigator.geolocation) {
            navigator.geolocation.watchPosition(
                (position) => {
                    userLat = position.coords.latitude;
                    userLng = position.coords.longitude;
                    updateMapData();
                },
                (error) => {
                    console.warn("لم يتم السماح بالوصول للموقع:", error);
                },
                { enableHighAccuracy: true }
            );
        }

        // 2️⃣ جلب التكاسي وتحديث الخريطة
        async function updateMapData() {
            try {
                const response = await fetch('https://Jalal1.pythonanywhere.com/get_drivers');
                const data = await response.json();

                markersGroup.clearLayers();
                const bounds = [];

                // رسم موقع المستخدم الحالي (دائرة زرقاء)
                if (userLat && userLng) {
                    L.circleMarker([userLat, userLng], {
                        radius: 9,
                        color: '#1A73E8',
                        fillColor: '#4285F4',
                        fillOpacity: 0.8
                    }).addTo(markersGroup).bindPopup("موقعك الحالي 🔵");

                    bounds.push([userLat, userLng]);
                }

                // رسم التكاسي
                if (Array.isArray(data) && data.length > 0) {
                    data.forEach(pos => {
                        if (pos.latitude && pos.longitude) {
                            const lat = pos.latitude;
                            const lng = pos.longitude;
                            const name = pos.driver_name || "تكسي 1";

                            L.marker([lat, lng], { icon: taxiIcon })
                             .addTo(markersGroup)
                             .bindPopup(`<b>🚕 ${name}</b><br>متصل ومتاح`);

                            bounds.push([lat, lng]);
                        }
                    });
                }

                // تعديل نطاق الخريطة ليركز على التاكسي وموقعك معاً
                if (bounds.length > 0) {
                    map.fitBounds(bounds, { padding: [50, 50], maxZoom: 16 });
                }

            } catch (err) {
                console.error("خطأ جلب البيانات:", err);
            }
        }

        setInterval(updateMapData, 3000);
        updateMapData();
    </script>
</body>
</html>
