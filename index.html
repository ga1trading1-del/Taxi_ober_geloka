<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تتبع التاكسي</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        html, body, #map { height: 100%; width: 100%; margin: 0; padding: 0; }
        .request-btn { background-color: #28a745; color: white; border: none; padding: 8px 12px; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 5px; width: 100%; }
    </style>
</head>
<body>
    <div id="map"></div>

    <script>
        const tg = window.Telegram ? window.Telegram.WebApp : null;
        if (tg) { tg.ready(); tg.expand(); }

        const map = L.map('map').setView([36.34, 43.13], 13);
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(map);

        const userIcon = L.divIcon({
            className: 'user-marker',
            html: '<div style="background-color: #007bff; width: 16px; height: 16px; border-radius: 50%; border: 3px solid white; box-shadow: 0 0 8px rgba(0,0,255,0.6);"></div>',
            iconSize: [20, 20], iconAnchor: [10, 10]
        });

        let userLat = null; let userLng = null;
        map.locate({setView: true, maxZoom: 15, enableHighAccuracy: true});
        map.on('locationfound', (e) => {
            userLat = e.latlng.lat; userLng = e.latlng.lng;
            L.marker(e.latlng, { icon: userIcon }).addTo(map).bindPopup("موقعك الحالي").openPopup();
        });

        let driverMarkers = {};

        async function fetchDrivers() {
            const traccarUrl = "http://13.48.26.152:8082";
            const authHeader = "Basic " + btoa("ga2trading2@gmail.com:1GALAL1galal");

            try {
                const [devicesRes, positionsRes] = await Promise.all([
                    fetch(`${traccarUrl}/api/devices`, { headers: { 'Authorization': authHeader, 'Accept': 'application/json' } }),
                    fetch(`${traccarUrl}/api/positions`, { headers: { 'Authorization': authHeader, 'Accept': 'application/json' } })
                ]);

                if (!devicesRes.ok || !positionsRes.ok) return;

                const devices = await devicesRes.json();
                const positions = await positionsRes.json();

                const posMap = {};
                positions.forEach(p => posMap[p.deviceId] = p);

                devices.forEach(device => {
                    const driverId = device.uniqueId;
                    const name = device.name || 'تاكسي';
                    const pos = posMap[device.id];

                    const lat = pos ? pos.latitude : 36.34;
                    const lng = pos ? pos.longitude : 43.13;

                    const popupContent = `
                        <div>
                            <b>السائق: ${name}</b><br>
                            <button class="request-btn" onclick="requestTaxi('${driverId}', '${name}')">طلب التاكسي</button>
                        </div>
                    `;

                    if (driverMarkers[driverId]) {
                        driverMarkers[driverId].setLatLng([lat, lng]);
                    } else {
                        driverMarkers[driverId] = L.marker([lat, lng]).addTo(map).bindPopup(popupContent);
                    }
                });
            } catch (err) {
                console.error("خطأ في جلب بيانات السائقين:", err);
            }
        }

        function requestTaxi(driverId, driverName) {
            const payload = {
                action: 'request_taxi',
                driver_id: driverId,
                driver_name: driverName,
                user_lat: userLat,
                user_lng: userLng
            };

            if (tg) {
                tg.sendData(JSON.stringify(payload));
                tg.close();
            } else {
                alert(`تم إرسال طلب للتاكسي: ${driverName}\nموقعك: ${userLat}, ${userLng}`);
            }
        }

        fetchDrivers();
        setInterval(fetchDrivers, 5000);
    </script>
</body>
</html>
