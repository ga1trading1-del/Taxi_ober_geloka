<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تكسي اوبر جيلوكا</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; font-family: Arial, sans-serif; }
        #map { width: 100%; height: 100vh; }
    </style>
</head>
<body>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // 1. إنشاء الخريطة
        var map = L.map('map').setView([33.3152, 44.3661], 13);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        var userCircle = null;
        var accuracyCircle = null;
        var driversMarkers = {};

        // 2. موقع الزبون اللحظي (الدائرة الزرقاء)
        if (navigator.geolocation) {
            navigator.geolocation.watchPosition(
                function(position) {
                    var lat = position.coords.latitude;
                    var lng = position.coords.longitude;
                    var accuracy = position.coords.accuracy;

                    if (userCircle) {
                        userCircle.setLatLng([lat, lng]);
                        accuracyCircle.setLatLng([lat, lng]).setRadius(accuracy);
                    } else {
                        accuracyCircle = L.circle([lat, lng], {
                            radius: accuracy,
                            color: '#1a73e8',
                            fillColor: '#1a73e8',
                            fillOpacity: 0.15,
                            stroke: false
                        }).addTo(map);

                        userCircle = L.circleMarker([lat, lng], {
                            radius: 8,
                            color: '#ffffff',
                            weight: 2,
                            fillColor: '#1a73e8',
                            fillOpacity: 1
                        }).addTo(map);

                        map.setView([lat, lng], 15);
                    }
                },
                function(error) { console.error("GPS Error:", error); },
                { enableHighAccuracy: true, maximumAge: 1000, timeout: 7000 }
            );
        }

        // 3. أيقونة التاكسي
        var taxiIcon = L.icon({
            iconUrl: 'https://cdn-icons-png.flaticon.com/512/3202/3202052.png',
            iconSize: [35, 35],
            iconAnchor: [17, 17],
            popupAnchor: [0, -15]
        });

        // 4. رابط الوسيط المباشر عبر حسابك Jalal1 في PythonAnywhere
        var apiUrl = 'https://Jalal1.pythonanywhere.com/get_drivers';

        function loadDrivers() {
            fetch(apiUrl)
            .then(response => response.json())
            .then(positions => {
                if (!Array.isArray(positions)) return;

                positions.forEach(pos => {
                    var deviceId = pos.deviceId;
                    var lat = pos.latitude;
                    var lng = pos.longitude;
                    var driverName = pos.driver_name || (`تكسي ${deviceId}`);

                    if (lat && lng) {
                        if (driversMarkers[deviceId]) {
                            driversMarkers[deviceId].setLatLng([lat, lng]);
                            driversMarkers[deviceId].getPopup().setContent(`<b>🚕 ${driverName}</b><br>متوفر حالياً`);
                        } else {
                            var marker = L.marker([lat, lng], { icon: taxiIcon })
                                .bindPopup(`<b>🚕 ${driverName}</b><br>متوفر حالياً`)
                                .addTo(map);
                            driversMarkers[deviceId] = marker;
                        }
                    }
                });
            })
            .catch(err => console.log("في انتظار بيانات السائقين...", err));
        }

        loadDrivers();
        setInterval(loadDrivers, 3000);
    </script>
</body>
</html>
