<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تتبع التاكسي</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map { height: 100vh; width: 100%; }
        body { margin: 0; padding: 0; }
    </style>
</head>
<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    const map = L.map('map').setView([0, 0], 13);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap'
    }).addTo(map);

    let marker;
    let userInteracted = false;

    // رصد تحريك أو تصغير/تكبير الخريطة من قبل المستخدم لتعطيل التمركز التلقائي
    map.on('dragstart zoomstart', function() {
        userInteracted = true;
    });

    // استخراج التوكن والمعرف من الرابط (Query Parameters)
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');
    const deviceId = urlParams.get('deviceId');

    async function fetchLocation() {
        if (!token || !deviceId) return;

        try {
            const response = await fetch(`https://pythonanywhere.com/get_location?token=${token}&deviceId=${deviceId}`);
            const data = await response.json();

            if (data.latitude && data.longitude) {
                const lat = data.latitude;
                const lng = data.longitude;

                if (!marker) {
                    marker = L.marker([lat, lng]).addTo(map);
                    map.setView([lat, lng], 15);
                } else {
                    marker.setLatLng([lat, lng]);
                }

                // يُعيد التمركز فقط إذا لم يقم المستخدم بتحريك الخريطة بنفسه
                if (!userInteracted) {
                    map.panTo([lat, lng]);
                }
            }
        } catch (error) {
            console.error("خطأ في جلب البيانات:", error);
        }
    }

    // جلب الموقع كل 5 ثوانٍ
    setInterval(fetchLocation, 5000);
    fetchLocation();
</script>

</body>
</html>
